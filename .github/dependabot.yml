# Keep the GitHub Actions we depend on (checkout, buildx, login, trivy...) current.
# Image base + pgvector versions are handled by check-upstream.yml, not here.
#
# Every action is pinned to an exact release tag, so every update edits a file
# under .github/workflows/, which build-and-publish.yml does not paths-ignore.
# Merging one to main without a skip marker rebuilds and republishes all four
# PG majors (new digests, signatures and SBOMs) with no image content change.
#
# - groups: all action updates from one weekly run land in a single PR.
# - prefix: puts [skip ci] in the commit subject AND the PR title, so the
#   squash-merge subject carries it whether GitHub takes it from the single
#   commit or from the PR title. The trailing space is deliberate: Dependabot
#   adds a colon after a prefix that ends in a letter, digit, ")" or "]", and a
#   trailing space stops that. Result:
#   "ci: [skip ci] bump the actions group with 2 updates".
# - ignore: sigstore/cosign-installer and anchore/sbom-action are never bumped
#   here. Both run in build-and-publish only AFTER the tags are moved, so a
#   skipped bump would first run unattended on the next upstream-bump publish,
#   and a failure there leaves new tags unsigned or without an SBOM
#   attestation. Dependabot has no per-dependency prefix, so their PRs would
#   carry [skip ci] too. Bump them by hand, merged WITHOUT the marker, and
#   check the sign and attest steps: see README.md, Maintenance.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "sigstore/cosign-installer"
      - dependency-name: "anchore/sbom-action"
    commit-message:
      prefix: "ci: [skip ci] "
    labels:
      - "dependencies"
      - "github-actions"
